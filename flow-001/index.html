 frameAspect=16/9;document.querySelector('#aspect').value='16:9';fitFrame();resize();
 seedParticles();paused=false;last=performance.now();fpsTime=last;frames=0;
 clearTimeout(noticeTimer);document.querySelector('#notice').textContent='';render();
 };
 document.querySelector('#record').onclick=startRecording;
}
function lockRecordingControls(locked){
 if(publicMode)return;
 document.querySelectorAll('aside input,aside select,aside button').forEach(el=>el.disabled=locked);
 document.querySelector('#record').textContent=locked?'動画を作成中…':'15秒の動画を書き出す';
}
// Single-track H.264 MP4, 60fps constant timing; encoded samples stay in decode order.
function makeMP4(chunks,width,height,avcc){
 if(!avcc||chunks.length!==900)throw Error('MP4の映像データが不完全です。');
 const join=parts=>{const out=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let pos=0;for(const p of parts){out.set(p,pos);pos+=p.length;}return out;};
 const u32=n=>new Uint8Array([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]);
 const u16=n=>new Uint8Array([n>>>8,n&255]);
 const text=s=>new TextEncoder().encode(s),zero=n=>new Uint8Array(n);
 const box=(type,...parts)=>{const data=join(parts);return join([u32(data.length+8),text(type),data]);};
 const full=(type,version,flags,...parts)=>box(type,new Uint8Array([version,flags>>16,(flags>>8)&255,flags&255]),...parts);
 const matrix=join([u32(65536),u32(0),u32(0),u32(0),u32(65536),u32(0),u32(0),u32(0),u32(0x40000000)]);
 const ftyp=box('ftyp',text('isom'),u32(512),text('isomiso2avc1mp41'));
 const duration=chunks.length;
 const mvhd=full('mvhd',0,0,u32(0),u32(0),u32(60),u32(duration),u32(65536),u16(256),zero(10),matrix,zero(24),u32(2));
 const tkhd=full('tkhd',0,7,u32(0),u32(0),u32(1),u32(0),u32(duration),zero(8),zero(8),matrix,u32(width*65536),u32(height*65536));
 const mdhd=full('mdhd',0,0,u32(0),u32(0),u32(60),u32(duration),u16(0x55c4),u16(0));
 const hdlr=full('hdlr',0,0,u32(0),text('vide'),zero(12),text('Granular Flow\0'));
 const avc1=box('avc1',zero(6),u16(1),zero(16),u16(width),u16(height),u32(0x00480000),u32(0x00480000),u32(0),u16(1),zero(32),u16(24),u16(65535),box('avcC',new Uint8Array(avcc)));
 const stsd=full('stsd',0,0,u32(1),avc1);
 const stts=full('stts',0,0,u32(1),u32(duration),u32(1));
 const stsc=full('stsc',0,0,u32(1),u32(1),u32(duration),u32(1));
 const stsz=full('stsz',0,0,u32(0),u32(duration),...chunks.map(c=>u32(c.data.length)));
 const keys=chunks.flatMap((c,i)=>c.key?[u32(i+1)]:[]);
 const stss=full('stss',0,0,u32(keys.length),...keys);
 // Realtime H.264 encoding must emit frames in presentation order.
 if(chunks.some((c,i)=>Math.abs(c.timestamp-Math.round(i*1000000/60))>1))throw Error('動画フレームの順序が不正です。');
 const moov=offset=>box('moov',mvhd,box('trak',tkhd,box('mdia',mdhd,hdlr,box('minf',full('vmhd',0,1,zero(8)),box('dinf',full('dref',0,0,u32(1),full('url ',0,1))),box('stbl',stsd,stts,stsc,stsz,stss,full('stco',0,0,u32(1),u32(offset)))))));
 const metadata=moov(ftyp.length+moov(0).length+8);
 const dataSize=chunks.reduce((n,c)=>n+c.data.length,0);
 return new Blob([ftyp,metadata,u32(dataSize+8),text('mdat'),...chunks.map(c=>c.data)],{type:'video/mp4'});
}
function stopRecording(reason=''){
 if(recording)recording.failure=reason||'書き出しを中止しました。';
}
async function startRecording(){
 if(recording)return;
 const notice=document.querySelector('#notice');
 if(!window.VideoEncoder||!window.VideoFrame){notice.textContent='高品質書き出しにはWebCodecs対応ブラウザーが必要です。Chromeなどで開いてください。';return;}
 const output=document.createElement('canvas');output.width=1024;output.height=Math.round(1024/frameAspect/2)*2;
 const session={output,chunks:[],failure:''};recording=session;lockRecordingControls(true);
 const oldWidth=canvas.width,oldHeight=canvas.height,oldRatio=ratio;
 let encoder;
 try{
 let config;
 for(const codec of ['avc1.64002a','avc1.4d002a','avc1.42002a']){
 const candidate={codec,width:output.width,height:output.height,bitrate:16000000,framerate:60,latencyMode:'realtime',avc:{format:'avc'}};
 if((await VideoEncoder.isConfigSupported(candidate)).supported){config=candidate;break;}
 }
 if(!config)throw Error('このブラウザーは指定サイズ・60fpsのMP4（H.264）生成に対応していません。別の対応ブラウザーでお試しください。');
 session.context=output.getContext('2d',{alpha:false});
 canvas.width=output.width;canvas.height=output.height;ratio=output.height/cssHeight;gl.viewport(0,0,canvas.width,canvas.height);
 encoder=new VideoEncoder({output:(chunk,metadata)=>{if(metadata?.decoderConfig?.description)session.avcc=new Uint8Array(metadata.decoderConfig.description).slice();const data=new Uint8Array(chunk.byteLength);chunk.copyTo(data);session.chunks.push({data,timestamp:chunk.timestamp,key:chunk.type==='key'});},error:error=>{session.failure=error.message;}});
 encoder.configure(config);
 if(densityDirty){configureDensity();densityDirty=false;}
 for(let i=0;i<900;i++){
 if(session.failure)throw Error(session.failure);
 if(i){const dt=1/60;simTime+=dt*params.speed*.25;boost*=Math.exp(-dt*.5);updateField(dt);advect(dt);replenish();}
 render();
 const frame=new VideoFrame(output,{timestamp:Math.round(i*1000000/60),duration:Math.round((i+1)*1000000/60)-Math.round(i*1000000/60)});
 try{encoder.encode(frame,{keyFrame:i%120===0});}finally{frame.close();}
 if(encoder.encodeQueueSize>4)await encoder.flush();
 if(i%3===0){notice.textContent='動画を作成中：'+Math.round((i+1)/9)+'％（1024 × '+output.height+'・60fps）。このタブを表示したままにしてください。';await new Promise(resolve=>setTimeout(resolve,0));}
 }
 await encoder.flush();if(session.failure)throw Error(session.failure);
 download(makeMP4(session.chunks,output.width,output.height,session.avcc),'granular-flow-15s-60fps-'+Date.now()+'.mp4');
 notice.textContent='15秒・60fpsの動画を保存しました（1024 × '+output.height+'／MP4・音声なし）。';
 }catch(error){notice.textContent='動画を書き出せませんでした：'+error.message;}
 finally{if(encoder&&encoder.state!=='closed')encoder.close();recording=null;canvas.width=oldWidth;canvas.height=oldHeight;ratio=oldRatio;gl.viewport(0,0,oldWidth,oldHeight);lockRecordingControls(false);last=performance.now();fitFrame();resize();needsDraw=true;}
}
let contextLost=false;canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();contextLost=true;stopRecording('描画が中断されたため録画を中止しました。');fail('描画が中断されました。ページを再読み込みしてください。');});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopRecording('タブが非表示になったため録画を中止しました。表示したまま再度お試しください。');last=performance.now();spoon.pendingX=0;spoon.pendingY=0;});
function animate(now){
 if(contextLost)return;
 const dt=Math.min((now-last)/1000,.025);last=now;
 if(!document.hidden&&!recording){
 if(densityDirty){configureDensity();densityDirty=false;}
 if(!paused){
 simTime+=dt*params.speed*.25;boost*=Math.exp(-dt*.5);updateField(dt);
 // One persistent integration pass; density accounting and upload packing share it.
 advect(dt);replenish();needsDraw=true;
 }
 if(needsDraw)render();
 frames++;if(now-fpsTime>750){if(!publicMode)document.querySelector('#fps').textContent=(frames*1000/(now-fpsTime)).toFixed(0)+' FPS';frames=0;fpsTime=now;}
 }
 requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
}

</script></body></html>
