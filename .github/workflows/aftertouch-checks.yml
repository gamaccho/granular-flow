name: AFTERTOUCH checks

on:
  push:
    branches: [main]
    paths:
      - 'experiments/aftertouch/**'
      - '.github/workflows/aftertouch-checks.yml'
  pull_request:
    paths:
      - 'experiments/aftertouch/**'
      - '.github/workflows/aftertouch-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/aftertouch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/aftertouch/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Check Pages preview on desktop and mobile
        env:
          AFTERTOUCH_PREVIEW_URL: http://127.0.0.1:5181/aftertouch001/
        run: |
          mkdir -p "$RUNNER_TEMP/aftertouch-pages-check/aftertouch001"
          cp -R dist/. "$RUNNER_TEMP/aftertouch-pages-check/aftertouch001/"
          python3 -m http.server 5181 --bind 127.0.0.1 --directory "$RUNNER_TEMP/aftertouch-pages-check" > "$RUNNER_TEMP/aftertouch-pages-http.log" 2>&1 &
          npm run test:browser -- --grep 'static Pages preview'
