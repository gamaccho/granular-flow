<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e18">
<title>SUITEKI — Once In The Flow</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e18;color:#344c4b;font-family:Helvetica,Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:fixed;top:max(30px,env(safe-area-inset-top));left:30px;pointer-events:none}h1{font-size:13px;font-weight:400;letter-spacing:.36em;margin:0 0 10px}.edition{font-size:9px;letter-spacing:.19em;opacity:.6}footer{position:fixed;left:28px;right:24px;bottom:max(26px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:20px;pointer-events:none}.hint{font-size:11px;line-height:1.9;letter-spacing:.1em;opacity:.7}.controls{display:flex;gap:8px;pointer-events:auto}button{font:inherit;font-size:11px;color:inherit;background:#ffffff40;border:1px solid #50686728;border-radius:30px;padding:12px 16px;cursor:pointer;backdrop-filter:blur(12px)}button:hover{background:#ffffff80}button:focus-visible{outline:2px solid #648c89;outline-offset:4px}#error{position:fixed;top:45%;left:10%;width:80%;text-align:center;line-height:1.8}body.dark{color:#c4d8d7;background:#15282b}body.dark button{background:#ffffff0b;border-color:#d0eeea30}@media(max-width:500px){header{top:max(25px,env(safe-area-inset-top));left:23px}footer{left:23px;right:18px}.hint{font-size:10px}button{padding:12px}}
</style>
</head>
<body class="dark">
<canvas aria-label="雨のガラス窓。指で内側の曇りを拭うと、屋外の景色が見えます。"></canvas>
<header><h1>SUITEKI</h1><div class="edition">by GAMACCHO</div></header>
<footer><div class="hint">窓の向こうに、雨の街。<br>なぞって、曇りを拭う。</div><div class="controls"><button id="light" hidden aria-label="背景の明暗を切り替え" aria-pressed="false">暗く</button><button id="sound" aria-pressed="false" aria-label="BGMを再生">sound on</button><button id="reset">Reset</button></div></footer>
<div id="error" hidden></div><div id="sound-status" role="status" aria-live="polite" style="position:fixed;bottom:80px;right:24px;font-size:11px" hidden></div>
<script src="rain.js?v=20"></script><script src="street.js?v=20"></script><script src="frog.js?v=20"></script><script src="water.js?v=20"></script>
<script src="music.js?v=20"></script>
</body>
</html>
