 ['粒の質感 / MATERIAL',[

 ['relief','粒の立体感',0,1,.01,.5,''],

 ['カラーバランス / BALANCE',[

 ['green','マゼンタ ← → グリーン',-100,100,1,0,''],

for(const [,items]of definitions)for(const [key,,,,,value]of items)params[key]=value;

 return {key,min,max,phase:Math.random()<.5?phase:Math.PI*2-phase,rate:Math.PI/(18+Math.random()*47),targetRate:Math.PI/(18+Math.random()*47),remaining:3+Math.random()*9};

let interactionStart=-Infinity,interactionFrom=1;

 const elapsed=(now-interactionStart)/1000;

}

function moveVortices(dt){
 const elapsed=dt*params.speed/3;
 for(let j=0;j<4;j++){

 while(v.elapsed>=v.duration){const remainder=v.elapsed-v.duration;v.x=v.toX;v.y=v.toY;nextVortexTarget(v);v.elapsed=remainder;}

const analyticFragment=`precision highp float;varying float particleOpacity;varying highp vec3 particlePigment;uniform float exposure,relief,roughness;
void main(){vec2 d=(gl_PointCoord-.5)*2.;float rr=dot(d,d);

const shadingCacheEnabled=new URLSearchParams(window.location?.search||'').get('shading')!=='0';
const cachedFragment=`precision highp float;varying float particleOpacity;varying highp vec3 particlePigment;uniform float exposure,relief,roughness;uniform sampler2D sphereLighting;
void main(){vec2 d=(gl_PointCoord-.5)*2.;float rr=dot(d,d);if(rr>1.)discard;
vec3 linear;

if(rr>.96){
vec3 n=normalize(vec3(d.x,-d.y,sqrt(max(.001,1.-rr))));

function createSphereLighting(size,relief,roughness){

 const lightLength=Math.hypot(-.45,.6,1),lx=-.45/lightLength,ly=.6/lightLength,lz=1/lightLength;

 const dx=(x+.5)/size*2-1,dy=(y+.5)/size*2-1;

function replenish(){
 // Fixed per-frame budgets: no full rescans or large allocations during playback.
 let added=0,donorChecks=0;
 for(let checks=0;checks<Math.min(4096,occupancy.length)&&added<256;checks++){

function backgroundColor(){

let estimatedOverlap=0,estimatedDiameter=0;
function shouldCullParticles(grain){
 // Sample the actual growing particles; no new arrays or full particle scan.

 let area=0;
 for(let j=0;j<samples;j++){

let coverage=new Uint8Array(0),coverageWidth=0,coverageHeight=0;
const COVER_TILE=8;

 for(let y=y0;y<=y1&&hidden;y++)for(let x=x0;x<=x1;x++)if(!coverage[y*cols+x]){hidden=false;break;}
 if(hidden){occlusionKeep[i]=0;continue;}

const meter=meterEnabled?document.createElement('pre'):null;

function render(){
