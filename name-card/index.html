<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171421}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}#error{display:none;position:fixed;inset:20px;padding:20px;color:white;background:#222;font:14px system-ui;pointer-events:none}

.social-links a:hover,.social-links a:focus-visible{opacity:1;background:rgba(12,12,20,.5)}

.title-mark,.byline-mark{position:fixed;z-index:5;left:50%;transform:translateX(-50%);height:auto;opacity:.72;pointer-events:none;user-select:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
.title-mark{top:calc(28px + env(safe-area-inset-top,0px));width:min(84vw,640px)}
.byline-mark{bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(32vw,160px)}

// not a Navier–Stokes simulation. New particles fade in over 1.2 seconds using alpha blending.
const definitions=[
 ['流れ / DYNAMICS',[
 ['speed','流れる速さ',0,6,.01,3,''],
 ['viscosity','粘りの強さ',.2,2.5,.01,1.35,''],
 ['fold','渦・折り重なり',0,2,.01,1,'']]],
 ['粒の質感 / MATERIAL',[
 ['grain','粒の大きさ',2,20,.1,6,' px'],
 ['relief','粒の立体感',0,1,.01,.5,''],
 ['grainVariation','粒径のバリエーション',0,100,1,50,'%']]],
 ['色 / HSL',[
 ['hue','色相',0,360,1,260,'°'],
 ['hueRange','色相の幅',0,360,1,50,'°'],
 ['saturation','彩度',40,100,1,70,'%'],
 ['lightness','明度',50,90,1,70,'%']]],
 ['カラーバランス / BALANCE',[
 ['red','シアン ← → レッド',-100,100,1,-100,''],
 ['green','マゼンタ ← → グリーン',-100,100,1,0,''],
 ['blue','イエロー ← → ブルー',-100,100,1,100,'']]]];
const params={roughness:1,exposure:1.10};
for(const [,items]of definitions)for(const [key,,,,,value]of items)params[key]=value;
Object.assign(params,{grain:6,relief:.30,grainVariation:100});
const fixedMaterial=new Set(['relief','grainVariation']);
// Each control traverses its full range independently. Half-cycles take 18–65s.
const automation=definitions.flatMap(([,items])=>items.filter(([key])=>!fixedMaterial.has(key)).map(([key,,min,max,,,])=>{
 const phase=Math.acos(1-2*(params[key]-min)/(max-min));
 return {key,min,max,phase:Math.random()<.5?phase:Math.PI*2-phase,rate:Math.PI/(18+Math.random()*47),targetRate:Math.PI/(18+Math.random()*47),remaining:3+Math.random()*9};
}));
// Real-time gesture envelope: 250ms rise, hold until 2s, then 2s return.
let interactionStart=-Infinity,interactionFrom=1;
function smoothTransition(t){return t*t*t*(t*(t*6-15)+10);}
function interactionMultiplier(now){
 const elapsed=(now-interactionStart)/1000;
 if(elapsed<.25)return interactionFrom+(2-interactionFrom)*smoothTransition(Math.max(0,elapsed/.25));
 if(elapsed<2)return 2;
 if(elapsed<4)return 2-smoothTransition((elapsed-2)/2);
 return 1;
}
function triggerInteraction(now){interactionFrom=interactionMultiplier(now);interactionStart=now;}
function updateAutomation(dt){
 for(const state of automation){
 state.remaining-=dt;
 if(state.remaining<=0){state.targetRate=Math.PI/(18+Math.random()*47);state.remaining=3+Math.random()*9;}

 }
}

 const bg=backgroundColor();gl.clearColor(bg[0],bg[1],bg[2],1);
 gl.depthMask(true);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(particles);
 for(const key of parameterKeys)if(u[key]!==null)gl.uniform1f(u[key],params[key]);
 gl.uniform3f(u.balance,params.red,params.green,params.blue);gl.uniform1f(u.aspect,aspect);gl.uniform1f(u.size,params.grain*ratio);gl.uniform1f(u.birthSize,2*ratio);
 const upload=uploadBuffers[uploadIndex];uploadIndex=(uploadIndex+1)%uploadBuffers.length;
 gl.bindBuffer(gl.ARRAY_BUFFER,upload.buffer);
 const requiredBytes=submittedCount*stride;
 if(requiredBytes>upload.capacity){upload.capacity=Math.ceil(requiredBytes/65536)*65536;gl.bufferData(gl.ARRAY_BUFFER,upload.capacity,gl.DYNAMIC_DRAW);}
 gl.bufferSubData(gl.ARRAY_BUFFER,0,submittedData.subarray(0,submittedCount*components));
 gl.enableVertexAttribArray(particleAttr);gl.vertexAttribPointer(particleAttr,4,gl.FLOAT,false,stride,0);
 gl.enableVertexAttribArray(opacityAttr);gl.vertexAttribPointer(opacityAttr,1,gl.FLOAT,false,stride,16);
 if(useDepth){
  gl.enableVertexAttribArray(depthAttr);gl.vertexAttribPointer(depthAttr,1,gl.FLOAT,false,stride,20);
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LESS);gl.disable(gl.BLEND);
  gl.drawArrays(gl.POINTS,0,opaqueCount);
  gl.enable(gl.BLEND);gl.depthMask(false);
  gl.drawArrays(gl.POINTS,opaqueCount,submittedCount-opaqueCount);
  gl.depthMask(true);gl.disable(gl.DEPTH_TEST);
 }else{
  gl.disableVertexAttribArray(depthAttr);gl.vertexAttrib1f(depthAttr,0);
  gl.drawArrays(gl.POINTS,0,submittedCount);
 }

 needsDraw=false;
}
let contextLost=false;canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();contextLost=true;fail('描画が中断されました。ページを再読み込みしてください。');});
document.addEventListener('visibilitychange',()=>{if(meterEnabled){meterState.frames=0;meterState.elapsed=0;meterState.previous=null;meterState.slow=null;frameHistoryCount=0;frameHistoryCursor=0;}clearDrag();resetInterpolation();last=performance.now();spoon.pendingX=0;spoon.pendingY=0;});
// One simulation step at most per display frame: no unbounded catch-up loop.
function advanceFrame(frameMs,now){
 const elapsed=Math.max(0,frameMs/1000);
 const dt=Math.min(elapsed,.025);
 updateAutomation(dt*interactionMultiplier(now));
 if(!paused){
  if(splitSimulation){
   simulationAccumulator+=Math.min(elapsed,.1);
   droppedSimulationSeconds+=Math.max(0,elapsed-.1);
   if(simulationAccumulator+1e-9>=SIM_STEP){
    const due=Math.floor((simulationAccumulator+1e-9)/SIM_STEP);
    droppedSimulationSeconds+=Math.max(0,due-1)*SIM_STEP;
    simulationAccumulator=Math.max(0,simulationAccumulator-due*SIM_STEP);
    simTime+=SIM_STEP*params.speed*.25;boost*=Math.exp(-SIM_STEP*.5);
    updateField(SIM_STEP);simulateParticles(SIM_STEP);replenish(2);simulationSteps++;
   }
   interpolationAlpha=Math.min(1,simulationAccumulator/SIM_STEP);
   packInterpolatedParticles(interpolationAlpha);
  }else{
   simTime+=dt*params.speed*.25;boost*=Math.exp(-dt*.5);updateField(dt);
   advect(dt);replenish();simulationSteps++;
  }
  needsDraw=true;
 }
 if(needsDraw)render();
}
function animate(now){
 if(contextLost)return;
 const frameMs=now-last;last=now;
 const cpuStarted=meterEnabled?performance.now():0;
 if(!document.hidden){
  advanceFrame(frameMs,now);
  if(meterEnabled){meterState.cpu=performance.now()-cpuStarted;updateMeter(now,frameMs);}
 }
 requestAnimationFrame(animate);
}
// Initialize curved velocities directly; no simulation warmup or saved arrays.
updateField(0,true);
last=performance.now();
requestAnimationFrame(animate);
}
